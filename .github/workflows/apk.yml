# Arma el APK cada vez que se guarda un cambio en main, y lo deja listo para
# bajar en la página de versiones del repositorio.
#
# QUE CUESTA: nada. No usa Claude ni gasta dinero; GitHub no cobra esto en
# repositorios públicos.

name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Puede escribir solo para publicar la versión nueva
permissions:
  contents: write

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Armar
        run: gradle assembleDebug --no-daemon

      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk contador-simple.apk
          gh release create "v${{ github.run_number }}" contador-simple.apk \
            --title "Versión ${{ github.run_number }}" \
            --notes "Bajar contador-simple.apk desde el teléfono e instalarlo." \
            --latest
